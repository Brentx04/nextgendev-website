<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 — Pagina niet gevonden | Next Gen Codes</title>
  <link rel="icon" type="image/png" href="/NGC.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #7c3aed;
      --purple-light: #c084fc;
      --grey: #9ca3af;
      --white: #f5f5f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: #07060f;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.18), transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 520px; }
    .code {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--purple-light), #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      margin: 1rem 0 0.8rem;
    }
    p { color: var(--grey); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), #ec4899);
      border-radius: 10px;
      padding: 0.95rem 1.8rem;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .home-btn:hover { opacity: 0.9; box-shadow: 0 0 24px rgba(124,58,237,0.45); }
    .home-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Pagina niet gevonden</h1>
    <p>Deze pagina bestaat niet of is verplaatst. Geen zorgen — we brengen u terug naar huis.</p>
    <a href="/" class="home-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      TERUG NAAR HOME
    </a>
  </div>
</body>
</html>
