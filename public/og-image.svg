<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06060f"/>
      <stop offset="100%" style="stop-color:#0d0520"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#06060f;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow blob -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#center-glow)" filter="url(#blur)"/>

  <!-- Corner accents -->
  <path d="M40,40 L100,40" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M40,40 L40,100" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M1160,40 L1100,40" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M1160,40 L1160,100" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M40,590 L100,590" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M40,590 L40,530" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M1160,590 L1100,590" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M1160,590 L1160,530" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5" fill="none"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#glow)"/>

  <!-- Badge -->
  <rect x="470" y="140" width="260" height="32" rx="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="492" cy="156" r="5" fill="#a78bfa"/>
  <text x="510" y="161" font-family="monospace" font-size="11" fill="#a78bfa" letter-spacing="3">NEXT GEN CODES</text>

  <!-- Main title -->
  <text x="600" y="255" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" text-anchor="middle" letter-spacing="-1" fill="#f5f3ff">UW VISIE</text>
  <text x="600" y="345" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" text-anchor="middle" letter-spacing="-1" fill="url(#glow)">VERTAALD NAAR CODE</text>

  <!-- Subtitle -->
  <text x="600" y="405" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#94a3b8">High-performance webapplicaties &amp; digitale oplossingen</text>
  <text x="600" y="435" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#94a3b8">Gevestigd in Genk, België</text>

  <!-- Bottom divider -->
  <rect x="200" y="490" width="800" height="1" fill="url(#glow)" fill-opacity="0.3"/>

  <!-- Stats -->
  <text x="300" y="535" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#f5f3ff">5+</text>
  <text x="300" y="558" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="2">PROJECTEN</text>

  <text x="600" y="535" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#f5f3ff">100%</text>
  <text x="600" y="558" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="2">TEVREDENHEID</text>

  <text x="900" y="535" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#f5f3ff">24u</text>
  <text x="900" y="558" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="2">REACTIETIJD</text>

  <!-- URL -->
  <text x="600" y="600" font-family="monospace" font-size="14" text-anchor="middle" fill="#7c3aed" letter-spacing="2">ngcodes.com</text>
</svg>
